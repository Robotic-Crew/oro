syntax = "proto3";

// Messages of the intrinsic plugin (skill-based cells, e.g. Intrinsic Core): behavior
// tree execution and perception. See the plugin README.
package oro.intrinsic;

// A node of the behavior tree being executed. `type` is the kind of skill, used to group steps
// in the cycle timeline: move | perception | gripper | wait | sequence | other
message ExecutionNode {
  string id = 1;
  string name = 2;
  string type = 3;
  // Empty for the root
  string parent_id = 4;
}

message ExecutionNodeState {
  string node_id = 1;
  // idle | running | succeeded | failed | cancelled
  string state = 2;
}

// State of the behavior tree execution, sent on every node state change.
// Sent through topic: r/<robot_id>/intrinsic/execution
message ExecutionStateMessage {
  int64 ts = 1;
  string tree_id = 2;
  string tree_name = 3;
  // The whole tree. May be left empty when it did not change since the previous message
  repeated ExecutionNode nodes = 4;
  repeated ExecutionNodeState node_states = 5;
  // idle | running | paused | succeeded | failed | cancelled
  string status = 6;
  string current_node_id = 7;
  string error = 8;
  // One id per run of the tree (a "cycle")
  string cycle_id = 9;
  int64 cycle_start_ts = 10;
}

// Position (meters) and orientation (quaternion; all zeros means identity)
message Pose3D {
  double x = 1;
  double y = 2;
  double z = 3;
  double qx = 4;
  double qy = 5;
  double qz = 6;
  double qw = 7;
}

message Point2D {
  float u = 1;
  float v = 2;
}

// Bounding box in image pixels
message Detection {
  string label = 1;
  float score = 2;
  float x = 3;
  float y = 4;
  float width = 5;
  float height = 6;
}

// Estimated 6-DoF pose of an object, and its axes projected on the image (pixels)
message EstimatedPose {
  string object_id = 1;
  Pose3D pose = 2;
  float confidence = 3;
  Point2D axis_origin = 4;
  Point2D axis_x = 5;
  Point2D axis_y = 6;
  Point2D axis_z = 7;
}

// One perception attempt (capture + detection + pose estimation).
// Sent through topic: r/<robot_id>/intrinsic/perception
message PerceptionResultMessage {
  int64 ts = 1;
  string camera_id = 2;
  string cycle_id = 3;
  // Encoded image (e.g. JPEG), as captured
  bytes image = 4;
  string image_mime = 5;
  uint32 width = 6;
  uint32 height = 7;
  repeated Detection detections = 8;
  repeated EstimatedPose poses = 9;
  bool success = 10;
  string error = 11;
}
